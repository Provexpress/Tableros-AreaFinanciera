name: Refresh dashboard data cache

on:
  workflow_dispatch:
    inputs:
      min_year:
        description: "Ano minimo a publicar en cache"
        required: false
        default: "2024"
  schedule:
    - cron: "15 10 * * 1-5" # 5:15 a.m. Colombia; apunta a 8:17 a.m.
    - cron: "0 11 * * 1-5" # 6:00 a.m. Colombia; respaldo para 8:42 a.m.
    - cron: "15 16 * * 1-5" # 11:15 a.m. Colombia; apunta a 1:17 p.m.
    - cron: "35 16 * * 1-5" # 11:35 a.m. Colombia; respaldo para 1:42 p.m.
    - cron: "10 18 * * 1-5" # 1:10 p.m. Colombia; apunta a 3:17 p.m.
    - cron: "50 18 * * 1-5" # 1:50 p.m. Colombia; respaldo para 3:42 p.m.

concurrency:
  group: refresh-dashboard-data-cache
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Excel files from SharePoint
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_GRAPH_HOSTNAME: provexpress.sharepoint.com
          MS_GRAPH_SITE_PATH: /sites/ProvexpressIntranet/Adminyfinanciero
          MS_GRAPH_DRIVE_NAME: Documentos compartidos
          MS_GRAPH_FOLDER_PATH: Facturación/Director de Facturación
          MS_GRAPH_ACUSES_FOLDER_PATH: Facturación/Asistente documental/control de acuses/ACUSES 2026
          MS_GRAPH_ACUSES_SEARCH_ROOT: Facturación
          MS_GRAPH_ACUSES_SEARCH_DEPTH: "5"
          MS_GRAPH_FILES: Control Facturas.xlsx,NOTAS CREDITO 2026.xlsx,reporte semanal de facturacion.xlsx
          MS_GRAPH_DOWNLOAD_ACUSES: "true"
        run: npm run download:ms-files

      - name: Build Excel-derived caches
        run: npm run build:data-cache

      - name: Build PBI API caches
        env:
          PBI_API_BASE_URL: ${{ secrets.PBI_API_BASE_URL }}
          PBI_API_USER: ${{ secrets.PBI_API_USER }}
          PBI_API_PASSWORD: ${{ secrets.PBI_API_PASSWORD }}
          PBI_API_AUTH_MODE: auto
          PBI_API_USER_FIELD: username
          PBI_API_PASSWORD_FIELD: password
          PBI_API_TOKEN_HEADER: Authorization
          PBI_CACHE_MIN_YEAR: ${{ github.event.inputs.min_year || vars.PBI_CACHE_MIN_YEAR || '2024' }}
        run: npm run build:pbi-cache

      - name: Validate app build
        run: npm run build

      - name: Commit refreshed caches
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): refresh dashboard cache"
          file_pattern: Data/_cache/*.json
